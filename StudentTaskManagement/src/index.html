<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Student Task Management System</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Student Task Management System</h1>

        <h2>Add New Task</h2>

        <input type="text"
            id="taskInput"
            placeholder="Enter your task" required>

        <button onclick="addTask()">Add Task</button>

        <h2>My Tasks</h2>

        <input
            type="text"
            id="searchInput"
            placeholder="Search tasks..."
            onkeyup="searchTasks()">

        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>

</html>
